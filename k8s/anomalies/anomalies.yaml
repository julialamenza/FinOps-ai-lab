apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-sync
  namespace: staging
  labels:
    app: backup-sync
    team: platform
    environment: staging
    cost-center: engineering
    workload-type: anomaly-demo
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app: backup-sync
            team: platform
            environment: staging
            cost-center: engineering
            workload-type: anomaly-demo
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: polinux/stress
              command: ["stress"]
              args: ["--cpu", "1", "--timeout", "90s"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "64Mi"
                limits:
                  cpu: "400m"
                  memory: "128Mi"
