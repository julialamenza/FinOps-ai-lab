apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-spike
  namespace: payments
  labels:
    app: cpu-spike
    team: payments
    environment: prod
    workload-type: anomaly-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-spike
  template:
    metadata:
      labels:
        app: cpu-spike
        team: payments
        environment: prod
        workload-type: anomaly-demo
    spec:
      containers:
        - name: stress
          image: polinux/stress
          env:
            - name: STRESS_TIMEOUT
              value: "300s"
          command:
            - sh
            - -c
            - stress --cpu 2 --timeout "${STRESS_TIMEOUT}"
          resources:
            requests:
              cpu: "500m"
              memory: "128Mi"
            limits:
              cpu: "2000m"
              memory: "512Mi"
