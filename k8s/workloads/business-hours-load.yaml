    team: users
    environment: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-steady-load
  template:
    metadata:
      labels:
        app: users-steady-load
        team: users
        environment: prod
    spec:
      containers:
        - name: load
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              while true; do
                curl -s -o /dev/null http://users-api/
                sleep 0.25
              done
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: apps/v1
