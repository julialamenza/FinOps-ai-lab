      labels:
        app: staging-idle-load
        team: platform
        environment: staging
    spec:
      containers:
        - name: load
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              while true; do
                curl -s -o /dev/null http://staging-api/
                sleep 60
              done
          resources:
