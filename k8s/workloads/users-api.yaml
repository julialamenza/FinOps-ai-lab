apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: users
  labels:
    app: users-api
    team: users
    environment: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
        team: users
        environment: prod
    spec:
      containers:
        - name: app
          image: nginx:stable
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
  namespace: users
  labels:
    app: users-api
    team: users
    environment: prod
spec:
  selector:
    app: users-api
  ports:
    - port: 80
      targetPort: 80